training:
  input:
    # - ../../dataset/h5_input/140X/SingleNeutrino_PU200_300k.h5                  # BKG
    - path: ../../dataset/h5_input/140X/QCD_Pt15To3000_PU200_95k.h5               # Fake MET
      max_events: -1
    - path: ../../dataset/h5_input/140X/WJetsToLNu_PU200_32k.h5
      max_events: -1
    - path: ../../dataset/h5_input/140X/TTbar_PU200_299k.h5
      max_events: -1
    - path: ../../dataset/h5_input/140X/TTToSemileptonic_PU200_238k.h5
      max_events: -1
    - path: ../../dataset/h5_input/140X/TTTo2L2Nu_PU200_499k.h5
      max_events: -1
    - path: ../../dataset/h5_input/140X/VBFHToInvisible_PU200_48k.h5
      max_events: -1

    - path: ../../dataset/h5_input/151X/QCD_15_3000_PU200_96k_151X.h5
      max_events: -1
    - path: ../../dataset/h5_input/151X/WJetsToLNu_PU200_34k_151X.h5
      max_events: -1
    # - path: ../../dataset/h5_input/151X/TTbar_PU200_300k_151X.h5                       # TEST
      # max_events: 50000
    # - path: ../../dataset/h5_input/151X/TTToSemileptonic_PU200_300k_151X.h5            # TEST
      # max_events: 50000
    - path: ../../dataset/h5_input/151X/TTTo2L2Nu_PU200_500k_151X.h5
      max_events: -1
    # - path: ../../dataset/h5_input/151X/VBF_HToInvisible_PU200_48k_151X.h5             # TEST
      # max_events: -1
  output: ./output/run_003_monitor
  epochs: 1000
  batch_size: 512
  norm_factor: 1.0
  model: TinyTables

model_cfg:
  NUM_PID: 8
  NUM_ETA: 8
  NUM_PT: 256
  D: 2

quantization:
  enable: true
  gamma:
    total_bits: 9
    integer_bits: 2
  beta:
    total_bits: 9
    integer_bits: 4

gpu:
  use_gpu: false
  gpu_index: 0
  memory_growth: true

callbacks:
  early_stopping_patience: 50
  reduce_lr_patience: 4
  reduce_lr_factor: 0.5
  min_lr: 1.0e-9
  monitor: "val_mean_squared_error"
  # monitor: "val_loss"